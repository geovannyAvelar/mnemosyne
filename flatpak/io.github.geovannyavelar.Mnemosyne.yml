# Flatpak manifest. Bundles its own poppler-qt6/libzip/libmobi and uses the
# KDE runtime's Qt, so the package doesn't depend on whichever Qt the host
# distro ships (the reason .debs are built per Ubuntu release).
#
# Build locally:
#   flatpak-builder --user --install-deps-from=flathub --force-clean \
#       build-flatpak flatpak/io.github.geovannyavelar.Mnemosyne.yml
app-id: io.github.geovannyavelar.Mnemosyne
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
# Provides QtWebEngine (HTML support) and the zypak sandbox wrapper.
base: io.qt.qtwebengine.BaseApp
base-version: "6.10"
command: mnemosyne-launcher
cleanup-commands:
  - /app/cleanup-BaseApp.sh

finish-args:
  - --share=ipc
  - --share=network # Google Drive sync, online book-info lookup
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio # QtWebEngine probes audio even without playback
  # No --filesystem access. Every path the app touches comes from a native
  # QFileDialog, which is the xdg-desktop-portal file chooser inside Flatpak:
  # the picked book/folder is exposed under /run/user/<uid>/doc/<id>/ and the
  # grant persists across restarts, so recents and the sync folder keep
  # working. Files opened from a file manager arrive the same way, via the
  # `@@ %F @@` file-forwarding markers in the .desktop Exec line below.
  # libsecret stores the Google OAuth refresh token via the Secret Service.
  - --talk-name=org.freedesktop.secrets

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - "*.a"
  - "*.la"
  - /share/man
  - /bin/opj_*
  - /bin/mobi*

modules:
  - name: openjpeg
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_CODEC=OFF
      - -DBUILD_STATIC_LIBS=OFF
    sources:
      - type: archive
        url: https://github.com/uclouvain/openjpeg/archive/refs/tags/v2.5.4.tar.gz
        sha256: a695fbe19c0165f295a8531b1e4e855cd94d0875d2f88ec4b61080677e27188a

  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=ON
      - -DENABLE_BOOST=OFF
      - -DENABLE_UTILS=OFF
      - -DENABLE_CPP=OFF
      - -DENABLE_GLIB=OFF
      - -DENABLE_NSS3=OFF
      - -DENABLE_GPGME=OFF
      - -DENABLE_LIBCURL=OFF
      - -DENABLE_LIBOPENJPEG=openjpeg2
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_QT5_TESTS=OFF
      - -DBUILD_QT6_TESTS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DBUILD_MANUAL_TESTS=OFF
      - -DTESTDATADIR=/nonexistent
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-26.10.0.tar.xz
        sha256: 6792cb7c69205007ad87d2e936cecc5b3a31fac29ab54ffc3175fdb6b2a6ce35

  - name: libzip
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_TOOLS=OFF
      - -DBUILD_REGRESS=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_DOC=OFF
    sources:
      - type: archive
        url: https://github.com/nih-at/libzip/releases/download/v1.12.1/libzip-1.12.1.tar.xz
        sha256: c40062022a1963c80573d48f6070792297cecd7c6bffe3aefcac0d8b9bee8913

  - name: libmobi
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/bfabiszewski/libmobi/releases/download/v0.12/libmobi-0.12.tar.gz
        sha256: 9a6fb2c56b916f8fa8b15e0c71008d908109508c944ea1d297881d4e277bf7e7

  - name: mnemosyne
    buildsystem: simple
    build-commands:
      # No network during the build, so quickjs-ng (normally fetched by
      # CMake's FetchContent) comes in as a pinned git source below.
      - >-
        cmake -S . -B _build -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_INSTALL_PREFIX=/app
        -DFETCHCONTENT_SOURCE_DIR_QUICKJS-NG=$PWD/quickjs-src
        -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - cmake --build _build --target Mnemosyne
      - cmake --install _build
      # Flatpak requires exported files to start with the app id.
      - mv /app/share/applications/mnemosyne.desktop /app/share/applications/io.github.geovannyavelar.Mnemosyne.desktop
      # Icon must match the app id. Exec must go through the zypak launcher
      # (Flatpak's exported `--command=` is taken from this line), and the
      # @@ markers make Flatpak pass opened files through the document portal.
      - sed -i -e 's/^Icon=.*/Icon=io.github.geovannyavelar.Mnemosyne/' -e 's|^Exec=.*|Exec=mnemosyne-launcher @@ %F @@|' /app/share/applications/io.github.geovannyavelar.Mnemosyne.desktop
      - >-
        for f in /app/share/icons/hicolor/*/apps/mnemosyne.*; do
        mv "$f" "$(dirname "$f")/io.github.geovannyavelar.Mnemosyne.${f##*.}"; done
      - install -Dm644 flatpak/io.github.geovannyavelar.Mnemosyne.metainfo.xml -t /app/share/metainfo
      - install -Dm755 flatpak/mnemosyne-launcher -t /app/bin
    sources:
      - type: dir
        path: ..
        skip:
          - build
          - build-flatpak
          - .flatpak-builder
          - .git
      - type: git
        url: https://github.com/quickjs-ng/quickjs.git
        tag: v0.16.2
        commit: 1ab8676f4b6d6d669baeb5f21790fb9734636a20
        dest: quickjs-src
