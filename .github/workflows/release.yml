name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract changelog section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            BEGIN { found = 0 }
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]") > 0) found = 1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "error: no CHANGELOG.md section found for version $version" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/mnemosyne-deb/*.deb \
            artifacts/mnemosyne-macos/*.dmg \
            artifacts/mnemosyne-windows/*.zip \
            artifacts/mnemosyne-windows-installer/*.exe \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md

  # Rebuilds the whole apt repo from scratch every release, from every .deb
  # ever published to this repo's Releases, and republishes it to GitHub
  # Pages. Stateless by design: no snapshot/db is carried over between runs,
  # so the repo can't drift from what's actually on the Releases page.
  #
  # One-time setup this job depends on (already done for this repo):
  #   - Settings > Pages > Build and deployment > Source = "GitHub Actions".
  #   - A GPG signing key, with its private key and passphrase saved as the
  #     APT_GPG_PRIVATE_KEY and APT_GPG_PASSPHRASE repo secrets.
  apt-repo:
    name: Publish APT repository
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Install aptly
        run: |
          version=1.6.3
          curl -fsSL "https://github.com/aptly-dev/aptly/releases/download/v${version}/aptly_${version}_linux_amd64.zip" -o aptly.zip
          unzip -q aptly.zip -d aptly-extracted
          sudo install -m 0755 "aptly-extracted/aptly_${version}_linux_amd64/aptly" /usr/local/bin/aptly
          aptly version

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          key_id=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          echo "GPG_KEY_ID=$key_id" >> "$GITHUB_ENV"
          gpg --batch --yes --export "$key_id" > pubkey.gpg

      - name: Download every .deb ever released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p debs
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName'); do
            # Older releases (before .deb packaging was added) have no matching
            # assets, which makes gh exit non-zero; skip those, not the release.
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir debs --skip-existing || true
          done
          ls -la debs

      - name: Build the repo
        env:
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          aptly repo create -distribution=stable -component=main mnemosyne
          aptly repo add mnemosyne debs
          aptly snapshot create mnemosyne-snapshot from repo mnemosyne

          echo "$GPG_PASSPHRASE" > /tmp/passphrase
          aptly publish snapshot -batch -passphrase-file=/tmp/passphrase -gpg-key="$GPG_KEY_ID" mnemosyne-snapshot
          rm -f /tmp/passphrase

      - name: Assemble Pages site
        run: |
          mkdir -p site
          cp -r ~/.aptly/public/. site/
          cp pubkey.gpg site/pubkey.gpg

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
