name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Reusable workflows (apt-repo.yml's "uses:" below) get the *intersection*
  # of the caller's and callee's permissions, not just what the callee
  # declares -- so pages/id-token have to be granted here too, or its Pages
  # deploy step silently loses them despite requesting them itself.
  pages: write
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract changelog section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            BEGIN { found = 0 }
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]") > 0) found = 1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "error: no CHANGELOG.md section found for version $version" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/mnemosyne-deb/*.deb \
            artifacts/mnemosyne-deb-arm64/*.deb \
            artifacts/mnemosyne-macos-arm64/*.dmg \
            artifacts/mnemosyne-macos-x86_64/*.dmg \
            artifacts/mnemosyne-windows/*.zip \
            artifacts/mnemosyne-windows-arm64/*.zip \
            artifacts/mnemosyne-windows-installer/*.exe \
            artifacts/mnemosyne-windows-installer-arm64/*.exe \
            artifacts/mnemosyne-android/*.apk \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md

  # See apt-repo.yml: rebuilds both the "stable" (every tagged release) and
  # "unstable" (see unstable.yml) APT distributions together and republishes
  # them to GitHub Pages, so a stable release also refreshes the unstable
  # distribution's copy of the site rather than only unstable.yml's own runs
  # doing so.
  apt-repo:
    needs: [release]
    uses: ./.github/workflows/apt-repo.yml
    secrets: inherit
