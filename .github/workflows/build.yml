name: Build

on:
  workflow_call:

env:
  QT_QPA_PLATFORM: offscreen
  QTWEBENGINE_DISABLE_SANDBOX: "1"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build build-essential pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-webengine-dev \
            libpoppler-qt6-dev libzip-dev libsecret-1-dev \
            libxkbcommon-x11-0 libxcb-cursor0

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnemosyne-deb
          path: build/*.deb
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install qt poppler-qt6 libzip ninja dylibbundler

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Package .dmg
        run: ./scripts/package-macos.sh build

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnemosyne-macos
          path: build/Mnemosyne-*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-poppler-qt6
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ntldd
            zip

      # QtWebEngine has no prebuilt Windows binaries at all (MinGW or MSVC) —
      # source-only, multi-hour build. HTML support is compiled out of the
      # Windows build (MNEMOSYNE_ENABLE_HTML defaults to OFF on WIN32); PDF
      # and EPUB are unaffected.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Package .zip
        run: ./scripts/package-windows.sh build

      - name: Upload .zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnemosyne-windows
          path: build/Mnemosyne-windows.zip
          if-no-files-found: error
